function coverCandidates(b){

async function coverFallback(img){

    if(img.hasAttribute('src')&&candidates.length)candidates.shift();
    img._coverQueue=candidates;

function compressPhoto(file){return new Promise((resolve,reject)=>{const i=new Image(),u=URL.createObjectURL(file);i.onload=()=>{try{const c=document.createElement('canvas'),s=Math.min(1,460/i.width,650/i.height);c.width=Math.max(1,Math.floor(i.width*s));c.height=Math.max(1,Math.floor(i.height*s));c.getContext('2d').drawImage(i,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.76))}catch(e){reject(e)}finally{URL.revokeObjectURL(u)}};i.onerror=reject;i.src=u})}
function removeBook(id){const b=book(id);if(!b||b.ownerId!==current)return;if(state.requests.some(r=>['pending','accepted'].includes(r.status)&&(r.wanted===id||r.offered===id)))return notice('這本書有進行中的交換，不能刪除');if(!confirm('確定刪除這本書？'))return;state.books=state.books.filter(x=>x.id!==id);for(const u of USERS)state.wishlist[u.id]=(state.wishlist[u.id]||[]).filter(x=>x!==id);save();closeModal();render();notice('書籍已刪除')}
function openExchange(id){const target=book(id);if(!target||target.ownerId===current||target.status!=='available')return notice('這本書目前無法交換');const available=own().filter(b=>b.status==='available');if(!available.length){popup(`<div class="modal-head"><h2>交換邀請</h2><button class="close" onclick="closeModal()">×</button></div>${empty('還沒有可交換的書','請先上架一本自己的書。','<button class="btn" onclick="closeModal();go(\'mybooks\');openForm()">新增書籍</button>')}`);return}popup(`<div class="modal-head"><h2>Request Exchange</h2><button class="close" onclick="closeModal()">×</button></div><div class="note">向 ${esc(user(target.ownerId).name)} 交換《${esc(target.title)}》</div><form onsubmit="submitExchange(event,'${id}')"><label class="field">我提供的書<select name="offered" required>${available.map(b=>`<option value="${b.id}">${esc(b.title)}</option>`).join('')}</select></label><label class="field" style="margin-top:15px">想說的話<textarea name="note" maxlength="250" placeholder="你好，我想用這本書跟你交換！"></textarea></label><div class="form-actions"><button class="btn" type="submit">送出邀請 ↗</button></div></form>`)}
function submitExchange(e,id){e.preventDefault();const wanted=book(id),f=new FormData(e.target),offered=book(String(f.get('offered')));if(!wanted||!offered||wanted.ownerId===current||offered.ownerId!==current||wanted.status!=='available'||offered.status!=='available')return notice('書籍已無法交換');if(state.requests.some(r=>r.from===current&&r.wanted===id&&r.status==='pending'))return notice('已送過相同邀請');const r={id:'r'+Date.now(),from:current,to:wanted.ownerId,wanted:id,offered:offered.id,status:'pending',method:'',location:'',created:Date.now(),note:String(f.get('note')||'')};state.requests.unshift(r);save();closeModal();go('sent');notice('已送出交換邀請，請切換對方帳號接收')}
const STATUS={pending:'待回覆',accepted:'已接受 · 待交付',rejected:'已拒絕',cancelled:'已取消',completed:'已完成'};
function requestCard(r){
const inbound=r.to===current, offered=book(r.offered), wanted=book(r.wanted);
const partner=user(inbound?r.from:r.to), name=esc(partner?.name||'未知使用者');
const myBook=inbound?wanted:offered, theirBook=inbound?offered:wanted;
const statusClass=['accepted','completed','rejected','cancelled'].includes(r.status)?r.status:'';
const actions=r.status==='pending'?(inbound
?`<button class="btn small" onclick="changeRequest('${r.id}','accepted')">✓ 接受邀請</button><button class="btn danger small" onclick="changeRequest('${r.id}','rejected')">拒絕</button>`
:`<button class="btn danger small" onclick="changeRequest('${r.id}','cancelled')">取消邀請</button>`)
:r.status==='accepted'?`<button class="btn small" onclick="openDelivery('${r.id}')">${r.method?'修改交付方式':'約定交付方式'}</button><button class="btn outline small" onclick="changeRequest('${r.id}','completed')">確認完成</button>`:'';
return `<article class="request-card">
<header class="req-header"><div class="req-header-main"><span class="req-avatar">${esc(partner?.name?.[0]||'?')}</span><div><p class="req-heading">${inbound?`${name} 向你提出交換`:`你向 ${name} 提出交換`}</p><p class="req-time">${new Date(r.created).toLocaleString('zh-TW')} · ${inbound?'收到的邀請':'送出的邀請'}</p></div></div><span class="req-status ${statusClass}">${esc(STATUS[r.status]||r.status)}</span></header>
<div class="req-body"><p class="req-section-title">交換內容</p><div class="req-book-pair"><div class="req-book giving"><small>${inbound?'他提供的書':'我提供的書'}</small><strong>《${esc(inbound?offered?.title||'已刪除':myBook?.title||'已刪除')}》</strong></div><div class="req-swap" aria-hidden="true">⇄</div><div class="req-book receiving"><small>${inbound?'他想交換到的書':'我想交換到的書'}</small><strong>《${esc(inbound?wanted?.title||'已刪除':theirBook?.title||'已刪除')}》</strong></div></div>
<div class="req-extra">${r.note?`<div class="req-note"><b>邀請留言</b>${esc(r.note)}</div>`:''}
<div class="req-delivery"><b>交付安排</b>${r.method?`<strong>${esc(r.method)}</strong> · ${esc(r.location||'尚未填寫詳細安排')}`:'雙方接受交換後，再約定面交或郵寄方式'}</div>
${contactDetails(r)}</div></div>
<footer class="req-footer"><span class="req-footer-hint">${r.status==='pending'?(inbound?'請確認是否願意交換這兩本書':'等待對方回覆'):r.status==='accepted'?'雙方已同意交換，可查看聯絡方式':'交換紀錄'}</span><div class="req-actions">${actions}</div></footer></article>`;
}
function changeRequest(id,status){const r=state.requests.find(x=>x.id===id);if(!r||!requestsFor().includes(r))return;
if(r.status==='pending'&&r.to===current&&(status==='accepted'||status==='rejected')){
const offered=book(r.offered)?.title||'未知書籍',wanted=book(r.wanted)?.title||'未知書籍';
const detail=`交換書籍：\n《${offered}》 ⇄ 《${wanted}》`;
const prompt=status==='accepted'
?`確定要接受這筆交換邀請嗎？\n\n${detail}\n\n接受後，雙方可查看彼此的聯絡方式，兩本書也會暫時保留，無法再接受其他交換邀請。`
:`確定要拒絕這筆交換邀請嗎？\n\n${detail}\n\n拒絕後，這筆邀請將結束，無法直接復原。`;
if(!window.confirm(prompt))return;
}
if(r.status==='pending'){if(status==='accepted'&&r.to===current){const a=book(r.offered),b=book(r.wanted);if(!a||!b||a.status!=='available'||b.status!=='available')return notice('其中一本書已不可交換');r.status='accepted';a.status='reserved';b.status='reserved';// Reject other pending requests involving reserved books.
for(const other of state.requests){if(other.id!==r.id&&other.status==='pending'&&[r.offered,r.wanted].some(id=>id===other.offered||id===other.wanted))other.status='rejected'}}else if(status==='rejected'&&r.to===current||status==='cancelled'&&r.from===current)r.status=status;else return}else if(r.status==='accepted'&&status==='completed'){if(!r.method||!r.location)return notice('請先約定面交或郵寄方式');r.status='completed';const a=book(r.offered),b=book(r.wanted);if(a)a.status='exchanged';if(b)b.status='exchanged'}else return;save();render();notice('交換狀態已更新')}
function openDelivery(id){const r=state.requests.find(x=>x.id===id);if(!r||r.status!=='accepted'||!requestsFor().includes(r))return;popup(`<div class="modal-head"><h2>如何交換書籍？</h2><button class="close" onclick="closeModal()">×</button></div><p class="guide">雙方同意後，可選擇公共場所面交或自行安排郵寄。交換邀請接受後，雙方可查看對方留下的聯絡方式，自行聯絡安排交付。請勿填寫私人住址。</p><form onsubmit="saveDelivery(event,'${id}')"><label class="field">交付方式<select name="method"><option ${r.method==='面交'?'selected':''}>面交</option><option ${r.method==='郵寄'?'selected':''}>郵寄</option></select></label><label class="field" style="margin-top:14px">約定地點／寄送方式說明（不填私人住址）<textarea required maxlength="160" name="location" placeholder="例如：捷運站公共區域／便利商店店到店">${esc(r.location||'')}</textarea></label><div class="form-actions"><button class="btn" type="submit">儲存約定</button></div></form>`)}
function saveDelivery(e,id){e.preventDefault();const r=state.requests.find(x=>x.id===id);if(!r||r.status!=='accepted'||!requestsFor().includes(r))return;const f=new FormData(e.target);r.method=String(f.get('method'));r.location=String(f.get('location')).trim();if(!r.location)return;save();closeModal();render();notice('交付方式已更新，雙方皆可查看')}
function saveContact(e){e.preventDefault();const f=new FormData(e.target),type=String(f.get('type')||''),value=String(f.get('value')||'').trim();if(!['Email','LINE ID','電話'].includes(type)||!value||value.length>100)return notice('請填寫有效的聯絡方式');if(type==='Email'&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value))return notice('Email 格式不正確');if(type==='電話'&&!/^[+0-9() -]{8,25}$/.test(value))return notice('電話格式不正確');state.contacts[current]={type,value};save();render();notice('聯絡方式已儲存')}
function contactDetails(r){if(!['accepted','completed'].includes(r.status))return '<p class="tiny muted">接受交換後才會顯示雙方聯絡方式。</p>';const partnerId=r.from===current?r.to:r.from,c=state.contacts?.[partnerId];return `<div class="contact-detail"><b>對方聯絡方式</b><p>${c?.value?`${esc(user(partnerId)?.name)} · ${esc(c.type)}：<span class="contact-value">${esc(c.value)}</span>`:'對方尚未留下聯絡方式，可請對方前往 Profile 填寫。'}</p></div>`}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
</script></body></html>
